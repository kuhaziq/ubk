<!DOCTYPE html>
<html>
<head>
  <title>KUHAZIQ</title>

  <style>
    body {
      margin: 0;
      background-color: #E6D7FF;
      font-family: Arial, sans-serif;
    }

    .logo {
      width: 150px;
      margin: 20px;
    }

    .box {
      background-color: #4B0082;
      color: #E0B3FF;
      width: 70%;
      margin: 50px auto;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    /* ===== INTRO ===== */
    #intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      text-align: center;
    }

    .track {
      width: 80%;
      height: 20px;
      background: white;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 0 20px red;
    }

    .car {
      position: absolute;
      font-size: 50px;
      top: -28px;
      animation: race 1.5s linear infinite;
    }

    @keyframes race {
      0% { left: -10%; }
      100% { left: 100%; }
    }

    #countdown {
      font-size: 90px;
      font-weight: bold;
      margin: 20px;
    }

    .intro-text {
      font-size: 20px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body onclick="startSound()">
  
<audio id="intro-sound" src="FormulaOneF1-SoundEffectProSounds(1).mp3"></audio>
  
<div id="intro">

  <div class="track">
    <div class="car">🏎️</div>
  </div>

  <h2 class="intro-text">GET READY YOUR FILE</h2>

  <div id="countdown">3</div>

</div>

<!-- 🌐 WEBSITE -->
<img src="https://smskp.edu.my/.png" class="logo">

<div class="box">
  <h1>SELAMAT DATANG KE UNIT BIMBINGAN KAUNSELING WEBSITE</h1>
  <p style="color:white">SEKOLAH MENENGAH SAINS KUBANG PASU</p>
</div>

<!-- ⚡ SCRIPT -->
<script>
function startSound(){
  document.getElementById("intro-sound").play();
}

window.onload = function() {

  let sound = document.getElementById("intro-sound");
  let count = 3;
  let el = document.getElementById("countdown");

  // autoplay attempt
  sound.play().catch(()=>{});

  let timer = setInterval(() => {

    count--;

    if(count > 0){
      el.innerText = count;
    }

    if(count === 0){
      el.innerText = "GO!";
    }

    if(count < 0){
      clearInterval(timer);

      sound.pause();
      sound.currentTime = 0;

      document.getElementById("intro").style.display = "none";
    }

  }, 1000);

};
</script>

</body>
</html>
